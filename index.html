<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>resource-calc</title>
<style>
  :root{
    --bg:#fafafa;
    --fg:#2a2a2a;
    --dim:#8a8a8a;
    --acc:#4a4a4a;
    --acc2:#a3611f;
    --border:#dcdcdc;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--fg);
    font-family:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
    font-size:14px;
    line-height:1.5;
  }
  body{
    max-width:720px;
    margin:0 auto;
    padding:32px 16px 80px;
  }
  h1{
    font-size:14px;
    font-weight:400;
    color:var(--acc);
    margin-bottom:4px;
  }
  h1::before{content:"$ ";color:var(--dim);}
  .sub{color:var(--dim);font-size:12px;margin-bottom:24px;}
  #form{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  input, button{
    font-family:inherit;
    font-size:14px;
    background:#fff;
    color:var(--fg);
    border:1px solid var(--border);
    padding:8px 10px;
    outline:none;
  }
  input:focus{border-color:var(--acc);}
  #item{flex:1;min-width:180px;}
  #qty{width:90px;}
  button{
    background:var(--acc);
    color:#fff;
    border:1px solid var(--acc);
    cursor:pointer;
    font-weight:600;
  }
  button:hover{opacity:.85;}
  button:active{transform:translateY(1px);}
  #matches{
    color:var(--dim);
    font-size:12px;
    margin-bottom:20px;
    min-height:16px;
  }
  #matches span{
    color:var(--acc2);
    cursor:pointer;
    margin-right:10px;
  }
  #matches span:hover{text-decoration:underline;}
  .err{color:#b3392f;font-size:12px;margin-bottom:16px;}
  section{margin-top:28px;}
  section h2{
    font-size:12px;
    text-transform:lowercase;
    color:var(--dim);
    border-bottom:1px solid var(--border);
    padding-bottom:6px;
    margin-bottom:10px;
  }
  table{width:100%;border-collapse:collapse;}
  td{padding:4px 0;font-size:13px;}
  td.qty{text-align:right;color:var(--acc);font-variant-numeric:tabular-nums;width:180px;white-space:nowrap;}
  td.name{color:var(--fg);}
  tr.raw td.qty{color:var(--acc2);}
  .empty{color:var(--dim);font-size:12px;}
  td.rm{width:70px;text-align:right;}
  td.rm button{
    background:transparent;
    color:var(--dim);
    border:1px solid var(--border);
    font-size:11px;
    padding:3px 6px;
    cursor:pointer;
  }
  td.rm button:hover{color:#b3392f;border-color:#b3392f;}
  .listActions{display:flex;gap:8px;margin-top:10px;}
  .listActions button{padding:6px 12px;font-size:12px;}
  button.secondary{background:transparent;color:var(--dim);border:1px solid var(--border);font-weight:400;}
  button.secondary:hover{color:var(--fg);}
  footer{
    margin-top:48px;
    color:var(--dim);
    font-size:11px;
    border-top:1px solid var(--border);
    padding-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .lang-opt{cursor:pointer;}
  footer a{color:inherit;text-decoration:none;}
  .lang-opt:hover{color:var(--fg);}
  .lang-opt.active{color:var(--acc2);}
</style>
</head>
<body>

<h1>mc-resource-calc</h1>

<div id="form">
  <input id="item" type="text" placeholder="item name (e.g. iron_pickaxe)" autocomplete="off">
  <input id="qty" type="number" min="1" value="1">
  <button type="button" id="calcSingleBtn">calculate</button>
  <button type="button" id="addBtn" class="secondary">add to list</button>
</div>
<div id="matches"></div>
<div id="err" class="err"></div>

<section>
  <h2 id="listTitle">items to craft</h2>
  <table id="list"><tbody></tbody></table>
  <div id="list-empty" class="empty">no items on the list yet.</div>
  <div class="listActions">
    <button id="calcBtn" type="button">calculate list</button>
    <button id="clearBtn" type="button" class="secondary">clear list</button>
  </div>
</section>

<section>
  <h2 id="rawTitle">required materials</h2>
  <table id="raw"><tbody></tbody></table>
  <div id="raw-empty" class="empty">no results yet.</div>
</section>

<footer>
  <a href="https://werc.cat-v.org/" target="_blank" rel="noopener" class="lang-opt">powered by werc.</a>
  <span>lang: <span class="lang-opt active" id="langEn">en</span> / <span class="lang-opt" id="langPt">pt-br</span></span>
</footer>

/* ---------- resolver direto (um nivel, igual a receita real) ---------- */
function calculate(itemKey, qty, raw, mid){
  const recipe = R[itemKey];
  if(!recipe){
    raw[itemKey] = (raw[itemKey]||0) + qty;
    return;
  }
  const crafts = Math.ceil(qty / recipe.output);
  for(const ing in recipe.ingredients){
    raw[ing] = (raw[ing]||0) + recipe.ingredients[ing] * crafts;
  }
}

function label(key){
  return key.replace(/_/g,' ');
}

function formatQty(qty){
  const stacks = Math.floor(qty / 64);
  const rest = qty % 64;
  if(stacks === 0) return String(qty);
  const stackLabel = stacks === 1 ? t('stack1') : t('stacks');
  const stackPart = rest === 0 ? `${stacks} ${stackLabel}` : `${stacks} ${stackLabel} + ${rest}`;
  return `${qty} (${stackPart})`;
}

let lastRaw = null;
let lastMid = null;

function render(raw, mid){
  lastRaw = raw;
  lastMid = mid;
  const rawBody = document.querySelector('#raw tbody');
  rawBody.innerHTML = '';

  const rawKeys = Object.keys(raw).sort();

  document.getElementById('raw-empty').style.display = rawKeys.length ? 'none' : 'block';

  for(const k of rawKeys){
    const tr = document.createElement('tr');
    tr.className = 'raw';
    tr.innerHTML = `<td class="name">${label(k)}</td><td class="qty">${formatQty(raw[k])}</td>`;
    rawBody.appendChild(tr);
  }
}

const matchesEl = document.getElementById('matches');
const errEl = document.getElementById('err');
const allKeys = Object.keys(R).sort();
const itemList = [];
renderList();
applyLang();

function matchKey(k, q){
  if(k.includes(q)) return true;
  const toks = q.split('_').filter(Boolean);
  return toks.length > 1 && toks.every(t => k.includes(t));
}

itemInput.addEventListener('input', () => {
  const v = itemInput.value.trim().toLowerCase();
  matchesEl.innerHTML = '';
  if(!v){ return; }
  const q = v.replace(/\s+/g, '_');
  const found = allKeys.filter(k => matchKey(k, q)).slice(0, 8);
  for(const k of found){
    const span = document.createElement('span');
    span.textContent = label(k);
    span.onclick = () => { itemInput.value = label(k); matchesEl.innerHTML = ''; itemInput.focus(); };
    matchesEl.appendChild(span);
  }
});

function calcSingle(){
  errEl.textContent = '';
  const key = itemInput.value.trim().toLowerCase().replace(/\s+/g,'_');
  const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);

  if(!key){ return; }
  if(!R[key]){
    errEl.textContent = t('errNotFound', key);
    render({}, {});
    return;
  }

  const raw = {};
  const mid = {};
  calculate(key, qty, raw, mid);
  render(raw, mid);
}

document.getElementById('calcSingleBtn').addEventListener('click', calcSingle);

itemInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    calcSingle();
  }
});

qtyInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    calcSingle();
  }
});

document.getElementById('addBtn').addEventListener('click', () => {
  errEl.textContent = '';
  const key = itemInput.value.trim().toLowerCase().replace(/\s+/g,'_');
  const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);

  if(!key){ return; }

  const existing = itemList.find(entry => entry.item === key);
  if(existing){
    existing.qty += qty;
  } else {
    itemList.push({item: key, qty});
  }

  itemInput.value = '';
  qtyInput.value = 1;
  matchesEl.innerHTML = '';
  itemInput.focus();
  renderList();
});

function renderList(){
  const listBody = document.querySelector('#list tbody');
  listBody.innerHTML = '';
  document.getElementById('list-empty').style.display = itemList.length ? 'none' : 'block';

  itemList.forEach((entry, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="name">${label(entry.item)}</td><td class="qty">${entry.qty}</td><td class="rm"><button type="button" data-idx="${idx}">${t('remove')}</button></td>`;
    listBody.appendChild(tr);
  });

  listBody.querySelectorAll('button[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      itemList.splice(parseInt(btn.dataset.idx, 10), 1);
      renderList();
    });
  });
}

document.getElementById('calcBtn').addEventListener('click', () => {
  errEl.textContent = '';
  if(itemList.length === 0){
    errEl.textContent = t('errEmptyList');
    return;
  }
  const raw = {};
  const mid = {};
  for(const entry of itemList){
    calculate(entry.item, entry.qty, raw, mid);
  }
  render(raw, mid);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  itemList.length = 0;
  renderList();
  render({}, {});
});
</script>
</body>
</html>
